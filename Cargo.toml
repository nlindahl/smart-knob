[workspace]
members = ["crates/view-model", "crates/editor", "crates/knobctl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minicbor = { version = "=2.3.0", features = ["std"] }
view-model = { path = "crates/view-model" }

[profile.release]
lto = "thin"
opt-level = "s"
