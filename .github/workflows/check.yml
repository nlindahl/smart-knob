name: Check
on: [push, pull_request]
jobs:
  core-and-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: pip install -r requirements-dev.txt
      - run: scripts/fetch-lvgl.sh ../lvgl
      - run: LVGL_DIR=../lvgl scripts/check.sh
  firmware:
    uses: ./.github/workflows/firmware.yml
  # Build the browser editor and LVGL preview on every push (Pages only
  # deploys from main) and run the editor's browser tests against it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: web-${{ runner.os }}-rust1.99-bindgen0.2.129-${{ hashFiles('Cargo.lock') }}
      - name: Install build tools
        run: |
          pip install cmake==4.4.4 ninja==1.13.2
          if ! command -v wasm-bindgen >/dev/null; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked
          fi
          scripts/fetch-lvgl.sh ../lvgl
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Build editor and LVGL preview
        env:
          LVGL_DIR: ../lvgl
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          scripts/build-web.sh
      - name: Browser tests (editor, live sync, diagnostics)
        run: |
          npm ci --prefix tests
          npm exec --prefix tests -- playwright install --with-deps chromium
          mkdir -p build-host
          cargo run --locked -p knobctl -- compile examples/demo.json build-host/demo.skv
          python3 scripts/serve.py &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          export CHROMIUM_PATH="$(cd tests && node -e "console.log(require('playwright').chromium.executablePath())")"
          node tests/browser.mjs
          SITE_URL=http://127.0.0.1:8080/ node tests/encoder-diagnostics.mjs
