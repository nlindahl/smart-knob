CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_LED_STRIP=y
CONFIG_DISPLAY=y
# Zephyr's LVGL module. Draw buffer: 10% of the 240x240 panel at 16 bpp.
CONFIG_LVGL=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# GC9A01 expects big-endian RGB565; the panel reports PIXEL_FORMAT_RGB_565.
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_FONT_MONTSERRAT_14=n
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_32=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_USE_LOG=n
CONFIG_LV_USE_THORVG_INTERNAL=n
CONFIG_LV_USE_VECTOR_GRAPHIC=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# Zephyr 4.5 no longer derives the image-header flash size from the module.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_PWM=y
CONFIG_MCPWM_ESP32=n
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PICOLIBC=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_ESP_SPIRAM=n
CONFIG_WIFI=n
CONFIG_BT=n
CONFIG_WATCHDOG=y
